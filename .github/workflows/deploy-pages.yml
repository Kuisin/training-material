name: Deploy to GitHub Pages

# 研修教材（静的HTML）を GitHub Pages へ公開するワークフロー。
# main ブランチへ push するたびに自動デプロイされる。手動実行も可能。

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（古い実行はキャンセルしない＝公開を中断させない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        # ビルド工程は無し（自己完結HTML）。リポジトリ全体をそのまま公開する。
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
