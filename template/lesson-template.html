<!DOCTYPE html>
<!--
  ============================================================================
  レッスンテンプレート（Vite + 共有コンポーネント版）  ·  ABeam 研修教材
  ============================================================================
  使い方（AI向け）:
    1. このファイルを次の場所にコピーする:  <track>/NN-kebab-title.html
    2. <body> の data-* を設定する:
         data-title … レッスンタイトル
         data-prev  … 前の章のファイル名（最初の章は空 "")
         data-next  … 次の章のファイル名（最後の章は空 "")
    3. #deck の中に <section class="slide" data-title="..."> を並べる（1スライド=1トピック）。
    4. 上部バー・前へ/次へ・ジャンプメニュー・進捗バー・AIボタン・Mermaid・確認テストは
       すべて /src/engine.js（共有コンポーネント）が生成・配線する。ここには書かない。
    5. スタイルは /src/styles.css（共有）から来る。独自CSSは書かない。
    6. Mermaid 図を1つ以上、確認テストのスライドを1つ以上必ず入れること。
    7. index.html にレッスンを追加する（template/index-template.html 参照）。

  使える部品（HTMLそのまま）:
    ・コールアウト: <div class="callout tip|warning|note">…</div>
    ・コードブロック: <pre><code>…</code></pre>
    ・図(Mermaid): <pre class="mermaid">flowchart LR; A--&gt;B</pre>
    ・確認テスト: <div class="quiz" data-answer="0始まり" data-explanation="…">…</div>
  ============================================================================
-->
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{LESSON_TITLE}} — ABeam 研修</title>
</head>
<body data-title="{{LESSON_TITLE}}" data-prev="{{PREV_HREF}}" data-next="{{NEXT_HREF}}">
  <div id="deck">

    <!-- スライド1 ・ タイトル／概要（最初のスライドとして残すこと） -->
    <section class="slide" data-title="概要">
      <hgroup>
        <h1>{{LESSON_TITLE}}</h1>
        <p>{{ONE_LINE_SUMMARY}}</p>
      </hgroup>
      <div class="lesson-meta">
        <span>⏱ {{DURATION}}</span><span>📶 {{LEVEL}}</span><span>🏷 {{TRACK}}</span>
      </div>
      <h3>この章で学ぶこと</h3>
      <ul>
        <li>{{GOAL_1}}</li>
        <li>{{GOAL_2}}</li>
        <li>{{GOAL_3}}</li>
      </ul>
    </section>

    <!-- スライド2 ・ 概念（トピックごとにこのブロックを複製） -->
    <section class="slide" data-title="{{SLIDE_2_MENU_LABEL}}">
      <h2>{{SLIDE_2_HEADING}}</h2>
      <p>{{PARAGRAPH}}</p>
      <pre><code>{{CODE_EXAMPLE}}</code></pre>
      <div class="callout tip">{{TIP_TEXT}}</div>
    </section>

    <!-- スライド3 ・ 図のスライド（必須: レッスンに図を1つ以上） -->
    <section class="slide" data-title="仕組み">
      <h2>仕組み</h2>
      <pre class="mermaid">
flowchart LR
  A[{{NODE_A}}] --> B[{{NODE_B}}]
      </pre>
    </section>

    <!-- スライド4 ・ 確認テスト（必須: テストのスライドを1つ以上・最後に置く） -->
    <section class="slide" data-title="確認テスト">
      <h2>理解度チェック</h2>
      <div class="quiz" data-answer="{{CORRECT_INDEX}}"
           data-explanation="{{EXPLANATION}}">
        <p><strong>{{QUESTION}}</strong></p>
        <button>{{OPTION_0}}</button>
        <button>{{OPTION_1}}</button>
        <button>{{OPTION_2}}</button>
        <p class="feedback"></p>
      </div>
    </section>

  </div>

  <!-- 共有エンジン（枠・ナビ・Mermaid・確認テスト・AIボタンを生成）。編集禁止。 -->
  <script type="module" src="/src/engine.js"></script>
</body>
</html>
