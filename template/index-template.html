<!DOCTYPE html>
<!--
  ============================================================================
  インデックステンプレート（Vite版）  ·  ABeam 研修教材
  ============================================================================
  使い方（AI向け）:
    1. 初回のみ、このファイルをリポジトリ直下に index.html としてコピーする。
    2. レッスンを作成するたびに、該当トラックの下に <li> リンクを追加する（NN順）。
    3. スタイルは /src/menu.js が読み込む共有CSSから来る。独自CSSは書かない。
  ============================================================================
-->
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABeam 研修教材</title>
  <script type="module" src="/src/menu.js"></script>
</head>
<body>
  <main class="container">

    <hgroup>
      <h1>ABeam 研修教材</h1>
      <p>自分のペースで学べるレッスン集。トピックを選んで始めましょう。</p>
    </hgroup>

    <section class="track">
      <h2>{{TRACK_NAME}}</h2>
      <ul>
        <li><a href="{{TRACK_FOLDER}}/01-introduction.html">1. {{LESSON_1_TITLE}}</a>
            <small>· {{LEVEL}} · {{DURATION}}</small></li>
        <!-- ここにレッスンを順番に追加 -->
      </ul>
    </section>

    <footer class="site">ABeam 研修教材</footer>
  </main>
</body>
</html>
